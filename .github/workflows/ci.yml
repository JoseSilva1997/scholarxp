# Runs frontend and backend lint/test/build in parallel for every branch push and PRs to main.
name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Frontend modules validate this at import-time; CI uses a safe placeholder backend URL.
      VITE_API_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        # Workspace packages export from dist/, so they must be built on fresh runners before type-aware lint/tests.
        run: pnpm -r --filter "./packages/*" build

      - name: Lint frontend
        run: pnpm --filter frontend lint

      - name: Test frontend
        run: pnpm --filter frontend test

      - name: Build frontend
        run: pnpm --filter frontend build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        # Backend imports shared contracts/permissions which resolve to dist artifacts in workspace packages.
        run: pnpm -r --filter "./packages/*" build

      - name: Generate Prisma client
        # Explicit generation keeps ESLint/TypeScript type resolution stable in fresh CI runners.
        run: pnpm --filter backend exec prisma generate

      - name: Lint backend
        run: pnpm --filter backend lint

      - name: Test backend
        run: pnpm --filter backend test

      - name: Build backend
        run: pnpm --filter backend build
